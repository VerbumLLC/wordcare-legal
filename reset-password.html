<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password · Word Care</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #F5F7FC; color: #1A1E36; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .card { background: #fff; max-width: 420px; width: 100%; border-radius: 16px; box-shadow: 0 8px 30px rgba(27,58,140,0.12); padding: 36px 28px; }
  h1 { color: #1B3A8C; font-size: 24px; margin: 0 0 6px; }
  p.sub { color: #8B93B4; font-size: 14px; margin: 0 0 24px; }
  label { display: block; font-size: 13px; font-weight: 600; color: #1A1E36; margin-bottom: 6px; }
  input { width: 100%; box-sizing: border-box; padding: 13px 14px; font-size: 15px; border: 1.5px solid #D8DEEC; border-radius: 10px; margin-bottom: 16px; }
  input:focus { outline: none; border-color: #1A7F7A; }
  button { width: 100%; padding: 14px; font-size: 15px; font-weight: 700; color: #fff; background: #1B3A8C; border: none; border-radius: 10px; cursor: pointer; }
  button:disabled { opacity: 0.6; cursor: default; }
  .msg { font-size: 14px; margin-top: 16px; padding: 12px 14px; border-radius: 8px; }
  .msg.error { background: #FDECE6; color: #C0492A; }
  .msg.success { background: #E6F4F3; color: #146963; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="card">
  <h1>Reset Your Password</h1>
  <p class="sub">Enter a new password for your Word Care account.</p>

  <div id="form-area">
    <label for="pw">New Password</label>
    <input type="password" id="pw" placeholder="At least 6 characters" autocomplete="new-password">

    <label for="pw2">Confirm Password</label>
    <input type="password" id="pw2" placeholder="Re-enter password" autocomplete="new-password">

    <button id="submitBtn">Update Password</button>
  </div>

  <div id="msg" class="msg hidden"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ====== FILL THESE IN ======
  const SUPABASE_URL = 'https://aobqgasihwxsvwccbwbl.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFvYnFnYXNpaHd4c3Z3Y2Nid2JsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3MTkwNzQsImV4cCI6MjA5NjI5NTA3NH0.AL5dEzrcDz9lItqhmpYpjHC0PgHdpXf5TeM_y2HQPu4';
  // ============================

  const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const msg = document.getElementById('msg');
  const formArea = document.getElementById('form-area');
  const btn = document.getElementById('submitBtn');

  function showMsg(text, type) {
    msg.textContent = text;
    msg.className = 'msg ' + type;
  }

  // When the user arrives from the reset email, Supabase puts a recovery
  // session in the URL. The client picks it up automatically.
  client.auth.onAuthStateChange((event) => {
    if (event === 'PASSWORD_RECOVERY') {
      // Ready for the user to enter a new password.
    }
  });

  btn.addEventListener('click', async () => {
    const pw = document.getElementById('pw').value;
    const pw2 = document.getElementById('pw2').value;

    if (pw.length < 6) { showMsg('Password must be at least 6 characters.', 'error'); return; }
    if (pw !== pw2) { showMsg('Passwords do not match.', 'error'); return; }

    btn.disabled = true;
    btn.textContent = 'Updating...';

    const { error } = await client.auth.updateUser({ password: pw });

    if (error) {
      showMsg(error.message || 'Could not update password. The link may have expired.', 'error');
      btn.disabled = false;
      btn.textContent = 'Update Password';
    } else {
      formArea.classList.add('hidden');
      showMsg('Your password has been updated. You can now return to the Word Care app and log in.', 'success');
    }
  });
</script>
</body>
</html>
